name: Connector fixture integration

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fixture-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.9.0"

jobs:
  detect:
    name: Select affected connector fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deferred: ${{ steps.matrix.outputs.deferred }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected connector fixtures
        id: matrix
        env:
          OMNIFIN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OMNIFIN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/connector-matrix.mjs
      - name: Report fixture coverage still under development
        if: steps.matrix.outputs.deferred != '[]'
        env:
          DEFERRED_SERVICES: ${{ steps.matrix.outputs.deferred }}
        run: >-
          node -e 'process.stdout.write("Pending fixture coverage is not part of this
          integration claim: " + JSON.parse(process.env.DEFERRED_SERVICES).join(", ") + "\n")'

  integration:
    name: Fixture integration (${{ matrix.service }})
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: scripts/ci/install-dependencies.sh
      - name: Run strict fixture integration gate
        env:
          OMNIFIN_INTEGRATION_SERVICE: ${{ matrix.service }}
        run: >-
          pnpm test:integration --service "$OMNIFIN_INTEGRATION_SERVICE"
          --mode fixture --strict
          --output "artifacts/integration/${OMNIFIN_INTEGRATION_SERVICE}/report.json"
      - name: Upload redacted fixture diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixture-integration-${{ matrix.service }}-diagnostics
          path: |
            artifacts/integration/${{ matrix.service }}
            test-results/integration/${{ matrix.service }}
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down fixture environment
        if: always()
        env:
          OMNIFIN_INTEGRATION_SERVICE: ${{ matrix.service }}
        run: |
          if [ -f compose.integration.yml ]; then
            docker compose --project-name "omnifin-${OMNIFIN_INTEGRATION_SERVICE}" --file compose.integration.yml down --volumes --remove-orphans
          fi

  authentik:
    name: Authentik OIDC integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: scripts/ci/install-dependencies.sh
      - name: Install isolated browser runtime
        run: node scripts/ci/install-playwright.mjs chromium
      - name: Run isolated Authentik authorization-code gate
        run: >-
          pnpm test:authentik --output
          artifacts/integration/authentik/report.json
      - name: Upload sanitized Authentik report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authentik-oidc-integration-report
          path: artifacts/integration/authentik/report.json
          if-no-files-found: error
          retention-days: 7

  oidc-provider:
    name: Standards-generic OIDC integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: scripts/ci/install-dependencies.sh
      - name: Install isolated browser runtime
        run: node scripts/ci/install-playwright.mjs chromium
      - name: Run isolated standards-generic authorization-code gate
        run: >-
          pnpm test:oidc-provider --output
          artifacts/integration/oidc-provider/report.json
      - name: Upload sanitized generic OIDC report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generic-oidc-integration-report
          path: artifacts/integration/oidc-provider/report.json
          if-no-files-found: error
          retention-days: 7

  playback-media-fixture:
    name: Generate copyright-free playback fixture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: scripts/ci/install-dependencies.sh
      - name: Pull immutable Jellyfin media runtime
        timeout-minutes: 10
        run: >-
          docker pull
          ghcr.io/jellyfin/jellyfin:10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
      - name: Generate and transcode media
        run: pnpm fixture:media --output artifacts/media/playback-fixture
      - name: Retain generated media report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-playback-fixture-report
          path: artifacts/media/playback-fixture/playback-fixture-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload generated media fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-playback-media-${{ github.run_id }}
          path: artifacts/media/playback-fixture
          if-no-files-found: error
          retention-days: 1

  playback-fixture:
    name: Jellyfin compatibility (${{ matrix.label }})
    needs: playback-media-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - image: ghcr.io/jellyfin/jellyfin:10.10.7@sha256:e4d1dc5374344446a3a78e43dd211247f22afba84ea2e5a13cbe1a94e1ff2141
            label: oldest-targeted
            version: 10.10.7
          - image: ghcr.io/jellyfin/jellyfin:10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
            label: latest-verified
            version: 10.11.11
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: scripts/ci/install-dependencies.sh
      - name: Download generated media fixture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-playback-media-${{ github.run_id }}
          path: artifacts/media/playback-fixture
      - name: Build playback connector
        run: pnpm --filter @omnifin/connectors... build
      - name: Pull immutable Jellyfin compatibility image
        env:
          JELLYFIN_IMAGE: ${{ matrix.image }}
        run: docker pull "$JELLYFIN_IMAGE"
      - name: Exercise Jellyfin identity and playback compatibility
        env:
          JELLYFIN_IMAGE: ${{ matrix.image }}
          JELLYFIN_LABEL: ${{ matrix.label }}
          JELLYFIN_VERSION: ${{ matrix.version }}
        run: >-
          pnpm fixture:jellyfin-playback
          --fixture artifacts/media/playback-fixture/omnifin-playback-fixture.mp4
          --output "artifacts/integration/jellyfin-playback/$JELLYFIN_LABEL/report.json"
          --image "$JELLYFIN_IMAGE"
          --expected-version "$JELLYFIN_VERSION"
      - name: Upload sanitized fixture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jellyfin-${{ matrix.label }}-compatibility-report
          path: |
            artifacts/integration/jellyfin-playback/${{ matrix.label }}/report.json
          if-no-files-found: error
          retention-days: 30

  download-client-fixtures:
    name: Isolated download-client integration (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - qbittorrent
          - sabnzbd
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: scripts/ci/install-dependencies.sh
      - name: Build download connectors
        run: pnpm --filter @omnifin/connectors... build
      - name: Exercise isolated download queue
        env:
          OMNIFIN_DOWNLOAD_CLIENT: ${{ matrix.service }}
        run: >-
          pnpm fixture:download-client
          --service "$OMNIFIN_DOWNLOAD_CLIENT"
          --output "artifacts/integration/download-clients/$OMNIFIN_DOWNLOAD_CLIENT/report.json"
      - name: Report sanitized fixture failure
        if: failure()
        env:
          OMNIFIN_DOWNLOAD_CLIENT: ${{ matrix.service }}
        shell: bash
        run: |
          report="artifacts/integration/download-clients/$OMNIFIN_DOWNLOAD_CLIENT/report.json"
          code="failure_report_missing"
          if [[ -f "$report" ]]; then
            parsed=$(jq -r --arg service "$OMNIFIN_DOWNLOAD_CLIENT" '
              if type == "object" and length == 4
                and .schemaVersion == 1 and .status == "failed" and .service == $service
                and (.code | type == "string" and test("^[a-z][a-z0-9_]{0,63}$"))
              then .code else "failure_report_invalid" end
            ' "$report") || parsed="failure_report_invalid"
            code="$parsed"
          fi
          printf '::error title=Download client fixture::%s\n' "$code"
      - name: Upload sanitized fixture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isolated-${{ matrix.service }}-fixture-report
          path: artifacts/integration/download-clients/${{ matrix.service }}/report.json
          if-no-files-found: error
          retention-days: 7

  servarr-service-fixtures:
    name: Isolated service integration (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        service:
          - radarr
          - sonarr
          - prowlarr
          - bazarr
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: scripts/ci/install-dependencies.sh
      - name: Build service connectors
        run: pnpm --filter @omnifin/connectors... build
      - name: Exercise isolated service reads and safe mutations
        env:
          OMNIFIN_SERVARR_SERVICE: ${{ matrix.service }}
        run: >-
          pnpm fixture:servarr-service
          --service "$OMNIFIN_SERVARR_SERVICE"
          --output "artifacts/integration/servarr-services/$OMNIFIN_SERVARR_SERVICE/report.json"
      - name: Report sanitized fixture failure
        if: failure()
        env:
          OMNIFIN_SERVARR_SERVICE: ${{ matrix.service }}
        shell: bash
        run: |
          report="artifacts/integration/servarr-services/$OMNIFIN_SERVARR_SERVICE/report.json"
          code="failure_report_missing"
          if [[ -f "$report" ]]; then
            parsed=$(jq -r --arg service "$OMNIFIN_SERVARR_SERVICE" '
              if type == "object" and length == 4
                and .schemaVersion == 1 and .status == "failed" and .service == $service
                and (.code | type == "string" and test("^[a-z][a-z0-9_]{0,63}$"))
              then .code else "failure_report_invalid" end
            ' "$report") || parsed="failure_report_invalid"
            code="$parsed"
          fi
          printf '::error title=Service fixture::%s\n' "$code"
      - name: Upload sanitized fixture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isolated-${{ matrix.service }}-service-report
          path: artifacts/integration/servarr-services/${{ matrix.service }}/report.json
          if-no-files-found: error
          retention-days: 7

  seerr-service-fixture:
    name: Isolated Seerr request integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: scripts/ci/install-dependencies.sh
      - name: Build Seerr connector
        run: pnpm --filter @omnifin/connectors... build
      - name: Exercise isolated Seerr request mutation
        run: >-
          pnpm fixture:seerr-service
          --output artifacts/integration/seerr-service/report.json
      - name: Report sanitized Seerr fixture failure
        if: failure()
        shell: bash
        run: |
          report="artifacts/integration/seerr-service/report.json"
          code="failure_report_missing"
          if [[ -f "$report" ]]; then
            parsed=$(jq -r '
              if type == "object" and length == 4
                and .schemaVersion == 1 and .status == "failed" and .service == "seerr"
                and (.code | type == "string" and test("^[a-z][a-z0-9_]{0,63}$"))
              then .code else "failure_report_invalid" end
            ' "$report") || parsed="failure_report_invalid"
            code="$parsed"
          fi
          printf '::error title=Seerr fixture::%s\n' "$code"
      - name: Upload sanitized Seerr fixture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isolated-seerr-service-report
          path: artifacts/integration/seerr-service/report.json
          if-no-files-found: error
          retention-days: 7

  gate:
    name: Connector integration
    if: always()
    needs:
      - authentik
      - detect
      - download-client-fixtures
      - integration
      - oidc-provider
      - playback-media-fixture
      - playback-fixture
      - seerr-service-fixture
      - servarr-service-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require connector selection and fixture integration
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = JSON.parse(process.env.JOB_RESULTS);
            const failed = Object.entries(jobs).filter(([, job]) => job.result !== "success");
            if (failed.length > 0) {
              console.error("Unsuccessful jobs: " + failed.map(([name, job]) => name + "=" + job.result).join(", "));
              process.exit(1);
            }
          '
