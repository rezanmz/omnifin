name: Open Trivy cache pull request

on:
  push:
    branches:
      - fix/trivy-cache-reuse

permissions:
  contents: read

jobs:
  open:
    if: github.actor == 'rezanmz'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Open pull request once
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PR_BODY: |
            ## Summary

            - reuse the complete Trivy report scan's workspace vulnerability databases for subsequent enforcement passes
            - prevent transient registry mirror failures from being misclassified as source security findings
            - apply the same cache discipline to pull-request security, edge candidate, and stable release candidate scans
            - enforce the behavior with repository workflow-policy tests

            ## Safety properties

            - the complete first scan still refreshes vulnerability databases and reports every severity
            - high and critical fixable vulnerabilities remain release-blocking
            - high and critical secret and infrastructure findings remain release-blocking
            - no vulnerability, file, directory, status, or rule suppression is introduced

            ## Verification

            - `pnpm format:check`
            - `pnpm lint`
            - `pnpm typecheck`
            - repository policy and integration harness (102 passing tests)
            - workflow YAML parser and pinned-action policy
        run: |
          pull_request_url=$(gh pr view \
            --repo "$GITHUB_REPOSITORY" \
            --head "$GITHUB_REF_NAME" \
            --json url \
            --jq .url 2>/dev/null || true)

          if [ -z "$pull_request_url" ]; then
            pull_request_url=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$GITHUB_REF_NAME" \
              --title "ci: reuse Trivy database cache" \
              --body "$PR_BODY")
          fi

          gh pr merge \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash \
            "$pull_request_url"
