name: Publish image

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, including the v prefix
        required: true
        type: string
      version:
        description: Stable SemVer version without the v prefix
        required: true
        type: string
      release_sha:
        description: Full immutable source commit for the release
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag, including the v prefix
        required: true
        type: string
      version:
        description: Stable SemVer version without the v prefix
        required: true
        type: string
      release_sha:
        description: Full immutable source commit referenced by the tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-stable-release
  cancel-in-progress: false

env:
  CI: "true"
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  NODE_VERSION: "24"
  ORAS_VERSION: "1.3.3"
  PNPM_VERSION: "11.9.0"
  SYFT_VERSION: "v1.49.0"

jobs:
  verify-main-gates:
    name: Verify exact release-source gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the protected gate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/heads/main
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Require successful CI and Security push runs for the exact source SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/verify-main-gates.mjs
          --sha "${{ inputs.release_sha }}"

  validate-release-metadata:
    name: Validate protected release metadata
    needs: verify-main-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # GitHub omits draft releases unless the caller has push access. This job
      # performs no mutation, but it must be able to see the Release Please draft.
      contents: write
    outputs:
      candidate_tag: ${{ steps.release-inputs.outputs.candidate_tag }}
      major: ${{ steps.release-inputs.outputs.major }}
      minor: ${{ steps.release-inputs.outputs.minor }}
    steps:
      - name: Bind release inputs to protected main
        id: release-inputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const version = process.env.RELEASE_VERSION;
            const releaseSha = process.env.RELEASE_SHA;
            const stableTag = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
            const fullSha = /^[0-9a-f]{40}$/;

            if (context.ref !== "refs/heads/main") {
              throw new Error("Stable releases must run from the main workflow definition.");
            }
            const match = tag.match(stableTag);
            if (!match || tag !== `v${version}`) {
              throw new Error("tag and version must identify the same stable SemVer release.");
            }
            if (!fullSha.test(releaseSha)) {
              throw new Error("release_sha must be a full lowercase commit SHA.");
            }

            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "main",
            });
            if (!branch.data.protected) {
              throw new Error("The main branch must be protected before publishing.");
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const release = releases.find((candidate) => candidate.tag_name === tag);
            if (!release?.draft || release.prerelease) {
              throw new Error(`Expected a non-prerelease draft for ${tag}.`);
            }

            const asParts = (candidateTag) => {
              const candidateMatch = candidateTag.match(stableTag);
              return candidateMatch ? candidateMatch.slice(1).map((part) => BigInt(part)) : null;
            };
            const compare = (left, right) => {
              for (let index = 0; index < 3; index += 1) {
                if (left[index] > right[index]) return 1;
                if (left[index] < right[index]) return -1;
              }
              return 0;
            };
            const requested = asParts(tag);
            const published = releases
              .filter((candidate) => !candidate.draft && !candidate.prerelease)
              .map((candidate) => ({ tag: candidate.tag_name, parts: asParts(candidate.tag_name) }))
              .filter((candidate) => candidate.parts);
            for (const candidate of published) {
              if (compare(requested, candidate.parts) <= 0) {
                throw new Error(
                  `${tag} would roll stable aliases back from published ${candidate.tag}.`,
                );
              }
            }

            const candidateTag = `candidate-${version}-${process.env.GITHUB_RUN_ID}`;
            if (candidateTag.length > 128) {
              throw new Error("The release version is too long for an immutable OCI candidate tag.");
            }
            core.setOutput("major", match[1]);
            core.setOutput("minor", match[2]);
            core.setOutput("candidate_tag", candidateTag);

  release-coverage:
    name: Resolve reviewed release coverage
    needs: validate-release-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      live_required: ${{ steps.coverage.outputs.live_required }}
      profile: ${{ steps.coverage.outputs.profile }}
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate phase profile, readiness, and version policy
        id: coverage
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          node scripts/integration/release-coverage.mjs
          --version "$RELEASE_VERSION" --github-output "$GITHUB_OUTPUT"

  validate-source:
    name: Validate release source and fixture gates
    needs: release-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha }}
      - name: Verify tag, source versions, and main ancestry
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git fetch --force origin "refs/heads/main:refs/remotes/origin/main"

          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main
          test "$(jq --raw-output '.version' package.json)" = "$RELEASE_VERSION"
          test "$(jq --raw-output '.["."]' .release-please-manifest.json)" = "$RELEASE_VERSION"
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: scripts/ci/install-dependencies.sh
      - name: Verify connector contracts
        run: pnpm test:contracts
      - name: Rehearse database migrations
        run: pnpm migration:smoke
      - name: Run required strict release fixtures
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          node scripts/integration/release-gate.mjs
          --version "$RELEASE_VERSION" --mode fixture
          --output artifacts/release-integration/fixture.json
      - name: Upload sanitized fixture release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: release-fixture-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-integration/fixture.json
          retention-days: 30

  validate-live-source:
    name: Validate required protected live coverage
    if: needs.release-coverage.outputs.live_required == 'true'
    needs:
      - release-coverage
      - validate-source
    environment: integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run required strict live release matrix
        env:
          OMNIFIN_AUTHENTIK_ISSUER_URL: ${{ vars.OMNIFIN_AUTHENTIK_ISSUER_URL }}
          OMNIFIN_BAZARR_API_KEY: ${{ secrets.OMNIFIN_BAZARR_API_KEY }}
          OMNIFIN_BAZARR_URL: ${{ vars.OMNIFIN_BAZARR_URL }}
          OMNIFIN_INTEGRATION_ALLOW_HTTP: ${{ vars.OMNIFIN_INTEGRATION_ALLOW_HTTP }}
          OMNIFIN_JELLYFIN_URL: ${{ vars.OMNIFIN_JELLYFIN_URL }}
          OMNIFIN_OIDC_ISSUER_URL: ${{ vars.OMNIFIN_OIDC_ISSUER_URL }}
          OMNIFIN_PROWLARR_API_KEY: ${{ secrets.OMNIFIN_PROWLARR_API_KEY }}
          OMNIFIN_PROWLARR_URL: ${{ vars.OMNIFIN_PROWLARR_URL }}
          OMNIFIN_QBITTORRENT_PASSWORD: ${{ secrets.OMNIFIN_QBITTORRENT_PASSWORD }}
          OMNIFIN_QBITTORRENT_URL: ${{ vars.OMNIFIN_QBITTORRENT_URL }}
          OMNIFIN_QBITTORRENT_USERNAME: ${{ secrets.OMNIFIN_QBITTORRENT_USERNAME }}
          OMNIFIN_RADARR_API_KEY: ${{ secrets.OMNIFIN_RADARR_API_KEY }}
          OMNIFIN_RADARR_URL: ${{ vars.OMNIFIN_RADARR_URL }}
          OMNIFIN_SABNZBD_API_KEY: ${{ secrets.OMNIFIN_SABNZBD_API_KEY }}
          OMNIFIN_SABNZBD_URL: ${{ vars.OMNIFIN_SABNZBD_URL }}
          OMNIFIN_SEERR_API_KEY: ${{ secrets.OMNIFIN_SEERR_API_KEY }}
          OMNIFIN_SEERR_URL: ${{ vars.OMNIFIN_SEERR_URL }}
          OMNIFIN_SONARR_API_KEY: ${{ secrets.OMNIFIN_SONARR_API_KEY }}
          OMNIFIN_SONARR_URL: ${{ vars.OMNIFIN_SONARR_URL }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          node scripts/integration/release-gate.mjs
          --version "$RELEASE_VERSION" --mode live
          --output artifacts/release-integration/live.json
      - name: Upload sanitized live release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: release-live-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-integration/live.json
          retention-days: 30

  source-gate:
    name: Release source coverage
    if: always()
    needs:
      - release-coverage
      - validate-source
      - validate-live-source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the reviewed phase coverage
        env:
          COVERAGE_RESULT: ${{ needs.release-coverage.result }}
          FIXTURE_RESULT: ${{ needs.validate-source.result }}
          LIVE_REQUIRED: ${{ needs.release-coverage.outputs.live_required }}
          LIVE_RESULT: ${{ needs.validate-live-source.result }}
          RELEASE_PROFILE: ${{ needs.release-coverage.outputs.profile }}
        run: |
          set -euo pipefail
          if [ "$COVERAGE_RESULT" != "success" ] || [ "$FIXTURE_RESULT" != "success" ]; then
            echo "::error::Release coverage metadata or fixture gates failed."
            exit 1
          fi
          if [ "$LIVE_REQUIRED" = "true" ] && [ "$LIVE_RESULT" != "success" ]; then
            echo "::error::The selected release profile requires successful protected live coverage."
            exit 1
          fi
          if [ "$LIVE_REQUIRED" != "true" ] && [ "$LIVE_RESULT" != "skipped" ]; then
            echo "::error::A release profile without live requirements unexpectedly ran live probes."
            exit 1
          fi
          echo "Release source satisfies the reviewed ${RELEASE_PROFILE} coverage profile."

  build-candidate:
    name: Build unprivileged candidate archive
    if: ${{ always() && needs.release-coverage.result == 'success' && needs.source-gate.result == 'success' }}
    needs:
      - release-coverage
      - source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}
      - name: Prepare release artifact directory
        run: mkdir --parents "${RUNNER_TEMP}/release-artifacts"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Derive candidate metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: omnifin
          tags: type=raw,value=${{ inputs.version }}
          labels: |
            org.opencontainers.image.title=Omnifin
            org.opencontainers.image.description=Self-hosted media control plane
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/tree/${{ inputs.release_sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.release_sha }}
            io.github.omnifin.release-profile=${{ needs.release-coverage.outputs.profile }}
      - name: Build multi-architecture OCI candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: |
            CHANNEL=stable
            VERSION=${{ inputs.version }}
            REVISION=${{ inputs.release_sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}/tree/${{ inputs.release_sha }}
          context: .
          file: Dockerfile
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: type=oci,dest=${{ runner.temp }}/release-artifacts/candidate.oci.tar
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          pull: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: Generate and validate portable SPDX SBOM
        env:
          OMNIFIN_SBOM_PATH: ${{ runner.temp }}/release-artifacts/sbom.spdx.json
          OCI_ARCHIVE: ${{ runner.temp }}/release-artifacts/candidate.oci.tar
          SYFT_COMMAND: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          "$SYFT_COMMAND" scan "oci-archive:${OCI_ARCHIVE}" \
            --output "spdx-json=${OMNIFIN_SBOM_PATH}"
          node scripts/check-sbom.mjs
      - name: Record candidate checksums
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/release-artifacts
        run: |
          set -euo pipefail
          cd "$ARTIFACT_DIRECTORY"
          sha256sum candidate.oci.tar sbom.spdx.json > SHA256SUMS
          sha256sum sbom.spdx.json > SBOM_SHA256SUMS
      - name: Upload candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: release-candidate-${{ github.run_id }}
          overwrite: true
          path: ${{ runner.temp }}/release-artifacts
          retention-days: 2
      - name: Retain release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: omnifin-${{ inputs.version }}-${{ github.run_id }}-spdx-sbom
          overwrite: true
          path: |
            ${{ runner.temp }}/release-artifacts/sbom.spdx.json
            ${{ runner.temp }}/release-artifacts/SBOM_SHA256SUMS
          retention-days: 90

  publish-candidate:
    name: Publish immutable candidate digest
    if: ${{ always() && needs.validate-release-metadata.result == 'success' && needs.source-gate.result == 'success' && needs.build-candidate.result == 'success' }}
    needs:
      - validate-release-metadata
      - source-gate
      - build-candidate
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Download candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}
          path: release-artifacts
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: ${{ env.ORAS_VERSION }}
      - name: Verify candidate bundle
        run: |
          set -euo pipefail
          cd release-artifacts
          sha256sum --check SHA256SUMS
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ github.token }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Push candidate without stable tags
        id: publish
        env:
          BUILD_DIGEST: ${{ needs.build-candidate.outputs.digest }}
          CANDIDATE_TAG: ${{ needs.validate-release-metadata.outputs.candidate_tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          assert_absent() {
            local output
            local status
            set +e
            output=$(oras resolve "$1" 2>&1)
            status=$?
            set -e
            if (( status == 0 )); then
              echo "::error::Refusing to overwrite existing registry reference $1."
              exit 1
            fi
            if ! grep --extended-regexp --ignore-case --quiet \
              'not found|manifest unknown|manifest_unknown|name unknown|name_unknown' <<<"$output"; then
              echo "::error::The registry did not prove that $1 is absent."
              exit 1
            fi
          }

          resolve_optional() {
            local output
            local status
            set +e
            output=$(oras resolve "$1" 2>&1)
            status=$?
            set -e
            if (( status == 0 )); then
              printf '%s' "$output"
              return 0
            fi
            if grep --extended-regexp --ignore-case --quiet \
              'not found|manifest unknown|manifest_unknown|name unknown|name_unknown' <<<"$output"; then
              return 1
            fi
            echo "::error::The registry could not safely resolve $1."
            exit 1
          }

          assert_absent "${IMAGE_NAME}:${RELEASE_VERSION}"
          if digest=$(resolve_optional "${IMAGE_NAME}:${CANDIDATE_TAG}"); then
            if [ "$digest" != "$BUILD_DIGEST" ]; then
              echo "::error::Existing candidate tag does not match this run's built digest."
              exit 1
            fi
          else
            oras cp --from-oci-layout \
              "release-artifacts/candidate.oci.tar:${RELEASE_VERSION}" \
              "${IMAGE_NAME}:${CANDIDATE_TAG}"
            digest=$(oras resolve "${IMAGE_NAME}:${CANDIDATE_TAG}")
          fi

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::GHCR returned an invalid candidate digest."
            exit 1
          fi
          if [[ "$digest" != "$BUILD_DIGEST" ]]; then
            echo "::error::Published candidate digest differs from the built OCI archive."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io || true

  attest-candidate:
    name: Sign and attest candidate digest
    if: ${{ always() && needs.build-candidate.result == 'success' && needs.publish-candidate.result == 'success' }}
    needs:
      - build-candidate
      - publish-candidate
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out the verified signing helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}
      - name: Download validated SPDX SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: omnifin-${{ inputs.version }}-${{ github.run_id }}-spdx-sbom
          path: release-evidence
      - name: Verify SBOM checksum
        run: |
          set -euo pipefail
          cd release-evidence
          sha256sum --check SBOM_SHA256SUMS
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ github.token }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ needs.publish-candidate.outputs.digest }}
          subject-name: ${{ env.IMAGE_NAME }}
      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          sbom-path: release-evidence/sbom.spdx.json
          subject-digest: ${{ needs.publish-candidate.outputs.digest }}
          subject-name: ${{ env.IMAGE_NAME }}
      - name: Sign image digest with keyless identity
        env:
          IMAGE_DIGEST: ${{ needs.publish-candidate.outputs.digest }}
        run: node scripts/ci/sign-oci-image.mjs
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io || true

  scan-candidate:
    name: Scan public release candidate (${{ matrix.target.platform }})
    if: ${{ always() && needs.publish-candidate.result == 'success' }}
    needs: publish-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - platform: linux/amd64
            suffix: linux-amd64
          - platform: linux/arm64
            suffix: linux-arm64
    steps:
      - name: Report all published candidate findings
        id: trivy-candidate-report
        env:
          TRIVY_PLATFORM: ${{ matrix.target.platform }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}@${{ needs.publish-candidate.outputs.digest }}
          scanners: vuln,secret,misconfig
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "0"
          format: sarif
          limit-severities-for-sarif: "false"
          output: trivy-release-candidate-${{ matrix.target.suffix }}.sarif
          timeout: 15m
          version: v0.70.0
      - name: Retain complete candidate scan report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omnifin-${{ inputs.version }}-candidate-scan-${{ matrix.target.suffix }}
          path: trivy-release-candidate-${{ matrix.target.suffix }}.sarif
          if-no-files-found: error
          retention-days: 30
      - name: Enforce fixable candidate vulnerabilities
        id: trivy-candidate-vulnerabilities
        continue-on-error: true
        env:
          TRIVY_PLATFORM: ${{ matrix.target.platform }}
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}@${{ needs.publish-candidate.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"
          format: table
          skip-setup-trivy: "true"
          timeout: 15m
          version: v0.70.0
      - name: Enforce candidate secret and IaC policy
        id: trivy-candidate-policy
        continue-on-error: true
        env:
          TRIVY_PLATFORM: ${{ matrix.target.platform }}
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}@${{ needs.publish-candidate.outputs.digest }}
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          skip-setup-trivy: "true"
          timeout: 15m
          version: v0.70.0
      - name: Enforce published candidate scan policy
        if: always() && (steps.trivy-candidate-vulnerabilities.outcome == 'failure' || steps.trivy-candidate-policy.outcome == 'failure')
        run: exit 1

  verify-candidate:
    name: Verify public candidate by digest
    if: ${{ always() && needs.validate-release-metadata.result == 'success' && needs.publish-candidate.result == 'success' && needs.attest-candidate.result == 'success' }}
    needs:
      - validate-release-metadata
      - publish-candidate
      - attest-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out immutable smoke harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: ${{ env.ORAS_VERSION }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Pull, verify, and exercise candidate anonymously
        env:
          CANDIDATE_TAG: ${{ needs.validate-release-metadata.outputs.candidate_tag }}
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
          IMAGE_DIGEST: ${{ needs.publish-candidate.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir --parents "$DOCKER_CONFIG"
          image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"

          test "$(oras resolve "${IMAGE_NAME}:${CANDIDATE_TAG}")" = "$IMAGE_DIGEST"
          manifest=$(docker buildx imagetools inspect "$image_ref" --format '{{json .Manifest}}')
          printf '%s' "$manifest" \
            | jq --exit-status \
              '[.manifests[].platform | "\(.os)/\(.architecture)"] | contains(["linux/amd64", "linux/arm64"])' \
              >/dev/null
          docker pull "$image_ref"
          docker image inspect "$image_ref" --format '{{json .RepoDigests}}' \
            | grep --fixed-strings "$IMAGE_DIGEST"

          cosign verify \
            --certificate-identity-regexp \
              "^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/(publish|release-please)\\.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$image_ref" >/dev/null
          node scripts/container-smoke.mjs --image "$image_ref"

  verify-install-bundle:
    name: Verify digest-pinned Compose installation
    if: ${{ always() && needs.publish-candidate.result == 'success' && needs.verify-candidate.result == 'success' }}
    needs:
      - publish-candidate
      - verify-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      OMNIFIN_BASE_URL: http://localhost:33012
      OMNIFIN_INSECURE_LOOPBACK_PREVIEW: "true"
      OMNIFIN_JELLYFIN_URL: https://jellyfin.invalid
      OMNIFIN_SECURE_COOKIES: "false"
      OMNIFIN_WEB_PORT: "33012"
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Generate isolated deployment credentials
        run: |
          set -euo pipefail
          backup_directory="${RUNNER_TEMP}/omnifin-install-backups"
          secret_directory="${RUNNER_TEMP}/omnifin-install-secrets"
          encryption_key_file="${secret_directory}/omnifin_encryption_key"
          recovery_secret_file="${secret_directory}/omnifin_recovery_secret"
          install --directory --mode 0700 "$secret_directory"
          umask 077
          openssl rand -base64 32 | tr -d '\n' > "$encryption_key_file"
          openssl rand -base64 48 | tr -d '\n' > "$recovery_secret_file"
          # Compose bind-mounts local secret files without remapping ownership. The
          # files must therefore be readable by the image's unprivileged UID; the
          # private 0700 parent directory keeps them inaccessible to other host users.
          chmod 0444 "$encryption_key_file" "$recovery_secret_file"
          {
            echo "OMNIFIN_BACKUP_DIRECTORY=$backup_directory"
            echo "OMNIFIN_ENCRYPTION_KEY_FILE=$encryption_key_file"
            echo "OMNIFIN_RECOVERY_SECRET_FILE=$recovery_secret_file"
          } >> "$GITHUB_ENV"
          sudo install --directory --mode 0700 --owner 65532 --group 65532 \
            "$backup_directory"
      - name: Generate the release installation bundle
        env:
          IMAGE_DIGEST: ${{ needs.publish-candidate.outputs.digest }}
        run: >-
          node scripts/release/install-bundle.mjs
          --version "${{ inputs.version }}"
          --digest "$IMAGE_DIGEST"
          --source-sha "${{ inputs.release_sha }}"
          --output "${{ runner.temp }}/omnifin-install"
      - name: Start, inspect, back up, and verify the release
        run: |
          set -euo pipefail
          bundle="${{ runner.temp }}/omnifin-install"
          compose=(
            docker compose
            --project-name "omnifin-install-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            --env-file "$bundle/omnifin.env.example"
            --file "$bundle/compose.yaml"
          )

          (cd "$bundle" && sha256sum --check SHA256SUMS)
          (
            cd "$bundle"
            jq --raw-output '.assets | to_entries[] | "\(.value)  \(.key)"' release-manifest.json \
              | sha256sum --check --strict
          )
          "${compose[@]}" config --quiet
          images=$("${compose[@]}" config --images | sort --unique)
          test "$images" = "$(grep '^OMNIFIN_IMAGE=' "$bundle/omnifin.env.example" | cut -d= -f2-)"
          "${compose[@]}" up --detach --wait
          gateway_container=$("${compose[@]}" ps --quiet gateway)
          web_container=$("${compose[@]}" ps --quiet web)
          test -n "$gateway_container"
          test -n "$web_container"
          docker inspect "$gateway_container" \
            | jq --exit-status '.[0] | .HostConfig.Memory == 805306368 and .HostConfig.NanoCpus == 2000000000 and .HostConfig.LogConfig.Type == "json-file" and .HostConfig.LogConfig.Config["max-size"] == "10m" and .HostConfig.LogConfig.Config["max-file"] == "3" and .State.Health.Status == "healthy" and any(.Mounts[]; .Destination == "/data" and .Type == "volume")' \
            >/dev/null
          docker inspect "$web_container" \
            | jq --exit-status '.[0] | .HostConfig.Memory == 1073741824 and .HostConfig.NanoCpus == 2000000000 and .HostConfig.LogConfig.Type == "json-file" and .HostConfig.LogConfig.Config["max-size"] == "10m" and .HostConfig.LogConfig.Config["max-file"] == "3" and .State.Health.Status == "healthy"' \
            >/dev/null
          curl --fail --silent --show-error "http://127.0.0.1:${OMNIFIN_WEB_PORT}/healthz" \
            >/dev/null
          curl --fail --silent --show-error "http://127.0.0.1:${OMNIFIN_WEB_PORT}/recovery" \
            >/dev/null
          "${compose[@]}" exec -T gateway \
            /nodejs/bin/node --input-type=module --eval '
              const response = await fetch("http://127.0.0.1:4000/readyz", {
                headers: { accept: "application/json" },
                redirect: "error",
                signal: AbortSignal.timeout(4_000),
              });
              if (!response.ok) process.exit(1);
              const body = await response.json();
              if (body?.status !== "ready" || body?.checks?.database !== "ok") process.exit(1);
            '
          "${compose[@]}" run --rm --no-deps maintenance backup \
            --output /backups/release-install.sqlite
          "${compose[@]}" run --rm --no-deps maintenance verify \
            --input /backups/release-install.sqlite
      - name: Record clean-host installation evidence
        env:
          CANDIDATE_DIGEST: ${{ needs.publish-candidate.outputs.digest }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          mkdir --parents artifacts/release
          node --input-type=module --eval '
            import { writeFile } from "node:fs/promises";
            const sourceSha = process.env.RELEASE_SHA;
            const candidateDigest = process.env.CANDIDATE_DIGEST;
            if (!/^[0-9a-f]{40}$/u.test(sourceSha)) throw new Error("invalid_source_sha");
            if (!/^sha256:[0-9a-f]{64}$/u.test(candidateDigest)) throw new Error("invalid_candidate_digest");
            await writeFile(
              "artifacts/release/install.json",
              JSON.stringify(
                {
                  candidateDigest,
                  checks: ["compose-config", "health", "recovery", "backup", "backup-verify"],
                  schemaVersion: 1,
                  sourceSha,
                },
                null,
                2,
              ) + "\n",
              { encoding: "utf8", mode: 0o644 },
            );
          '
      - name: Upload sanitized clean-host installation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: omnifin-${{ inputs.version }}-install-rehearsal-${{ github.run_id }}
          path: artifacts/release/install.json
          retention-days: 30
      - name: Tear down the release installation
        if: always()
        run: |
          bundle="${{ runner.temp }}/omnifin-install"
          if [ -f "$bundle/compose.yaml" ] && [ -f "$bundle/omnifin.env.example" ]; then
            docker compose \
              --project-name "omnifin-install-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --env-file "$bundle/omnifin.env.example" \
              --file "$bundle/compose.yaml" \
              down --volumes --remove-orphans
          fi

  rehearse-upgrade:
    name: Rehearse upgrade and exact-digest rollback
    if: ${{ always() && needs.validate-release-metadata.result == 'success' && needs.publish-candidate.result == 'success' && needs.verify-candidate.result == 'success' }}
    needs:
      - validate-release-metadata
      - publish-candidate
      - verify-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out immutable upgrade harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: ${{ env.ORAS_VERSION }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Resolve previous stable digest
        id: previous
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir --parents "$DOCKER_CONFIG"
          stable_metadata=$(
            oras repo tags "$IMAGE_NAME" --format json \
              | node --input-type=module --eval '
                  let source = "";
                  for await (const chunk of process.stdin) source += chunk;
                  const payload = JSON.parse(source);
                  if (!Array.isArray(payload.tags)) throw new Error("GHCR returned an invalid tag list.");
                  const stable = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
                  const versions = payload.tags
                    .map((tag) => ({ match: tag.match(stable), tag }))
                    .filter((entry) => entry.match)
                    .sort((left, right) => {
                      for (let index = 1; index <= 3; index += 1) {
                        const difference = BigInt(right.match[index]) - BigInt(left.match[index]);
                        if (difference !== 0n) return difference > 0n ? 1 : -1;
                      }
                      return 0;
                    });
                  process.stdout.write(JSON.stringify({
                    count: versions.length,
                    newest: versions[0]?.tag ?? null,
                  }));
                '
          )
          stable_count=$(jq --raw-output '.count' <<<"$stable_metadata")
          newest_version=$(jq --raw-output '.newest // empty' <<<"$stable_metadata")

          set +e
          previous_digest=$(oras resolve "${IMAGE_NAME}:latest" 2>/dev/null)
          resolve_status=$?
          set -e

          if (( resolve_status == 0 )); then
            if [[ ! "$previous_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::The previous stable alias returned an invalid digest."
              exit 1
            fi
            if (( stable_count == 0 )); then
              echo "::error::The latest alias exists without an immutable stable version tag."
              exit 1
            fi
            if [ "$(oras resolve "${IMAGE_NAME}:${newest_version}")" != "$previous_digest" ]; then
              echo "::error::The latest alias does not match the newest stable version digest."
              exit 1
            fi
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "digest=$previous_digest" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if (( stable_count != 0 )); then
            echo "::error::Stable releases exist but the latest alias could not be resolved."
            exit 1
          fi
          published_count=$(
            gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --slurp \
              | jq --raw-output \
                '[.[][] | select(.draft == false and .prerelease == false)] | length'
          )
          if (( published_count != 0 )); then
            echo "::error::Published releases exist but no prior stable image can be resolved."
            exit 1
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "No prior stable release exists; the reviewed initial-release exception applies."
      - name: Exercise upgrade and rollback on the hosted runner
        env:
          CANDIDATE_DIGEST: ${{ needs.publish-candidate.outputs.digest }}
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
          PREVIOUS_AVAILABLE: ${{ steps.previous.outputs.available }}
          PREVIOUS_DIGEST: ${{ steps.previous.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir --parents "$DOCKER_CONFIG" artifacts/release
          candidate_ref="${IMAGE_NAME}@${CANDIDATE_DIGEST}"
          docker pull "$candidate_ref"

          if [ "$PREVIOUS_AVAILABLE" = "true" ]; then
            previous_ref="${IMAGE_NAME}@${PREVIOUS_DIGEST}"
            cosign verify \
              --certificate-identity-regexp \
                "^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/(publish|release-please)\\.yml@refs/heads/main$" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$previous_ref" >/dev/null
            docker pull "$previous_ref"
            node scripts/release/upgrade-rehearsal.mjs \
              --candidate-image "$candidate_ref" \
              --previous-image "$previous_ref" \
              --output artifacts/release/upgrade-rehearsal.json
          else
            node scripts/release/upgrade-rehearsal.mjs \
              --candidate-image "$candidate_ref" \
              --initial-release \
              --output artifacts/release/upgrade-rehearsal.json
          fi
      - name: Upload sanitized upgrade rehearsal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omnifin-${{ inputs.version }}-upgrade-rehearsal
          path: artifacts/release/upgrade-rehearsal.json
          if-no-files-found: error
          retention-days: 30

  validate-v1-evidence:
    name: Validate exact-candidate v1 evidence
    if: >-
      ${{
        always() &&
        needs.release-coverage.result == 'success' &&
        needs.release-coverage.outputs.profile == 'v1' &&
        needs.publish-candidate.result == 'success' &&
        needs.scan-candidate.result == 'success' &&
        needs.verify-candidate.result == 'success' &&
        needs.verify-install-bundle.result == 'success' &&
        needs.rehearse-upgrade.result == 'success'
      }}
    needs:
      - release-coverage
      - publish-candidate
      - scan-candidate
      - verify-candidate
      - verify-install-bundle
      - rehearse-upgrade
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      # Persist the normalized v1 record to the Release Please draft before
      # aliases move; Actions artifact retention alone is not durable evidence.
      contents: write
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download Tier 1 fixture evidence
        if: needs.release-coverage.outputs.profile == 'v1'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-fixture-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-downloads/fixture
      - name: Download Tier 2 live evidence
        if: needs.release-coverage.outputs.profile == 'v1'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-live-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-downloads/live
      - name: Download Tier 3 AMD64 scan evidence
        if: needs.release-coverage.outputs.profile == 'v1'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: omnifin-${{ inputs.version }}-candidate-scan-linux-amd64
          path: evidence-downloads/scan-linux-amd64
      - name: Download Tier 3 ARM64 scan evidence
        if: needs.release-coverage.outputs.profile == 'v1'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: omnifin-${{ inputs.version }}-candidate-scan-linux-arm64
          path: evidence-downloads/scan-linux-arm64
      - name: Download Tier 4 installation evidence
        if: needs.release-coverage.outputs.profile == 'v1'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: omnifin-${{ inputs.version }}-install-rehearsal-${{ github.run_id }}
          path: evidence-downloads/install
      - name: Download Tier 4 upgrade evidence
        if: needs.release-coverage.outputs.profile == 'v1'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: omnifin-${{ inputs.version }}-upgrade-rehearsal
          path: evidence-downloads/upgrade
      - name: Download Tier 4 home-lab evidence
        if: needs.release-coverage.outputs.profile == 'v1'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const release = releases.find(
              (candidate) => candidate.tag_name === process.env.RELEASE_TAG,
            );
            if (!release?.draft || release.prerelease) {
              throw new Error(`Expected an unpublished, non-prerelease draft for ${process.env.RELEASE_TAG}.`);
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              per_page: 100,
            });
            const reports = assets.filter(
              (asset) => asset.name === "v1-home-lab-report.json" && asset.state === "uploaded" && asset.size > 0,
            );
            if (reports.length !== 1) {
              throw new Error("Expected exactly one uploaded v1-home-lab-report.json asset on the release draft.");
            }
            const response = await github.rest.repos.getReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: reports[0].id,
              headers: { accept: "application/octet-stream" },
            });
            const outputDirectory = path.join(process.env.GITHUB_WORKSPACE, "evidence-downloads", "home-lab");
            fs.mkdirSync(outputDirectory, { recursive: true, mode: 0o700 });
            fs.writeFileSync(path.join(outputDirectory, "home-lab.json"), Buffer.from(response.data), {
              flag: "wx",
              mode: 0o600,
            });

      - name: Assemble exact-candidate v1 evidence
        if: needs.release-coverage.outputs.profile == 'v1'
        env:
          CANDIDATE_DIGEST: ${{ needs.publish-candidate.outputs.digest }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          mkdir --parents evidence-inputs artifacts/release-evidence
          install --mode 0600 evidence-downloads/fixture/fixture.json evidence-inputs/fixture.json
          install --mode 0600 evidence-downloads/live/live.json evidence-inputs/live.json
          install --mode 0600 \
            evidence-downloads/scan-linux-amd64/trivy-release-candidate-linux-amd64.sarif \
            evidence-inputs/scan-linux-amd64.sarif
          install --mode 0600 \
            evidence-downloads/scan-linux-arm64/trivy-release-candidate-linux-arm64.sarif \
            evidence-inputs/scan-linux-arm64.sarif
          install --mode 0600 evidence-downloads/install/install.json evidence-inputs/install.json
          install --mode 0600 evidence-downloads/upgrade/upgrade-rehearsal.json evidence-inputs/upgrade.json
          install --mode 0600 evidence-downloads/home-lab/home-lab.json evidence-inputs/home-lab.json
          install --mode 0600 evidence-downloads/home-lab/home-lab.json artifacts/release-evidence/home-lab.json
          node scripts/integration/release-evidence-assembly.mjs \
            --candidate-digest "$CANDIDATE_DIGEST" \
            --input-directory evidence-inputs \
            --output-directory artifacts/release-evidence \
            --release-tag "${{ inputs.tag }}" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --source-sha "$RELEASE_SHA" \
            --verified-at "$(date --utc +%F)"
      - name: Upload validated v1 evidence records
        if: always() && needs.release-coverage.outputs.profile == 'v1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: v1-evidence-index-${{ github.run_id }}
          path: artifacts/release-evidence/
          retention-days: 90
      - name: Attach durable v1 evidence records to the draft
        if: needs.release-coverage.outputs.profile == 'v1'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVIDENCE_DIRECTORY: artifacts/release-evidence
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const path = require("node:path");
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const release = releases.find(
              (candidate) => candidate.tag_name === process.env.RELEASE_TAG,
            );
            if (!release?.draft || release.prerelease) {
              throw new Error(`Expected an unpublished, non-prerelease draft for ${process.env.RELEASE_TAG}.`);
            }
            const tierNames = [1, 2, 3, 4].map(
              (tier) => `v1-evidence-tier-${tier}-${context.runId}.json`,
            );
            const indexName = `v1-evidence-index-${context.runId}.json`;
            const homeLabName = `v1-home-lab-report-${context.runId}.json`;
            const homeLab = fs.readFileSync(path.join(process.env.EVIDENCE_DIRECTORY, "home-lab.json"));
            const index = fs.readFileSync(path.join(process.env.EVIDENCE_DIRECTORY, "index.json"));
            const assets = [
              ...tierNames.map((name) => [
                name,
                fs.readFileSync(path.join(process.env.EVIDENCE_DIRECTORY, name)),
              ]),
              [homeLabName, homeLab],
              [indexName, index],
              [
                `${indexName}.sha256`,
                Buffer.from(`${crypto.createHash("sha256").update(index).digest("hex")}  ${indexName}\n`),
              ],
            ];
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              per_page: 100,
            });
            for (const [name] of assets) {
              if (existing.some((asset) => asset.name === name)) {
                throw new Error(`Refusing to overwrite release asset ${name}.`);
              }
            }
            for (const [name, data] of assets) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name,
                data,
                headers: {
                  "content-length": data.length,
                  "content-type": "application/octet-stream",
                },
              });
            }

  promote-stable:
    name: Promote verified digest to stable tags
    if: >-
      ${{
        always() &&
        needs.release-coverage.result == 'success' &&
        needs.validate-release-metadata.result == 'success' &&
        needs.publish-candidate.result == 'success' &&
        needs.scan-candidate.result == 'success' &&
        needs.verify-candidate.result == 'success' &&
        needs.verify-install-bundle.result == 'success' &&
        needs.rehearse-upgrade.result == 'success' &&
        (
          needs.release-coverage.outputs.profile != 'v1' ||
          needs.validate-v1-evidence.result == 'success'
        )
      }}
    needs:
      - release-coverage
      - validate-release-metadata
      - publish-candidate
      - scan-candidate
      - verify-candidate
      - verify-install-bundle
      - rehearse-upgrade
      - validate-v1-evidence
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The final pre-promotion check must still be able to see the unpublished
      # Release Please draft. Package aliases are mutated only after that check.
      contents: write
      packages: write
    steps:
      - name: Check out immutable release source
        if: needs.release-coverage.outputs.profile == 'v1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}
      - name: Revalidate durable v1 evidence
        if: needs.release-coverage.outputs.profile == 'v1'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CANDIDATE_DIGEST: ${{ needs.publish-candidate.outputs.digest }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const crypto = require("node:crypto");
            const path = require("node:path");
            const { pathToFileURL } = require("node:url");
            const { validateV1EvidenceIndex } = await import(
              pathToFileURL(
                path.join(process.env.GITHUB_WORKSPACE, "scripts/integration/release-evidence.mjs"),
              ).href,
            );
            const decode = (data, label) => {
              try {
                return new TextDecoder("utf-8", { fatal: true }).decode(data);
              } catch {
                throw new Error(`${label} must be valid UTF-8.`);
              }
            };
            const parse = (data, label) => {
              try {
                return JSON.parse(decode(data, label));
              } catch (error) {
                if (error instanceof SyntaxError) throw new Error(`${label} must be valid JSON.`);
                throw error;
              }
            };
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const release = releases.find(
              (candidate) => candidate.tag_name === process.env.RELEASE_TAG,
            );
            if (!release?.draft || release.prerelease) {
              throw new Error(`Expected an unpublished, non-prerelease draft for ${process.env.RELEASE_TAG}.`);
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              per_page: 100,
            });
            const readAsset = async (name) => {
              const matches = assets.filter(
                (asset) => asset.name === name && asset.state === "uploaded" && asset.size > 0,
              );
              if (matches.length !== 1) throw new Error(`Expected exactly one uploaded ${name} asset.`);
              const response = await github.rest.repos.getReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: matches[0].id,
                headers: { accept: "application/octet-stream" },
              });
              return Buffer.from(response.data);
            };
            const indexName = `v1-evidence-index-${context.runId}.json`;
            const homeLabName = `v1-home-lab-report-${context.runId}.json`;
            const [indexData, checksumData, homeLabData] = await Promise.all([
              readAsset(indexName),
              readAsset(`${indexName}.sha256`),
              readAsset(homeLabName),
            ]);
            const expectedChecksum = `${crypto.createHash("sha256").update(indexData).digest("hex")}  ${indexName}\n`;
            if (decode(checksumData, `${indexName}.sha256`) !== expectedChecksum) {
              throw new Error("The durable v1 evidence index checksum does not match.");
            }
            const index = parse(indexData, indexName);
            const validated = validateV1EvidenceIndex(index, {
              candidateDigest: process.env.CANDIDATE_DIGEST,
              sourceSha: process.env.RELEASE_SHA,
            });
            const tierFourName = `v1-evidence-tier-4-${context.runId}.json`;
            const tierFourData = await readAsset(tierFourName);
            const tierFour = parse(tierFourData, tierFourName);
            const tierFourRecord = validated.records.find((record) => record.tier === 4);
            if (
              tierFour?.sourceSha !== process.env.RELEASE_SHA ||
              tierFour?.candidateDigest !== process.env.CANDIDATE_DIGEST ||
              !Array.isArray(tierFour?.inputs) ||
              tierFourRecord?.artifact.sha256 !== crypto.createHash("sha256").update(tierFourData).digest("hex")
            ) {
              throw new Error("The durable Tier 4 evidence record does not match the exact candidate.");
            }
            const homeLabInput = tierFour.inputs.filter((input) => input?.name === "home-lab.json");
            if (
              homeLabInput.length !== 1 ||
              homeLabInput[0].sha256 !== crypto.createHash("sha256").update(homeLabData).digest("hex")
            ) {
              throw new Error("The durable Tier 4 evidence record does not bind the immutable home-lab report.");
            }
      - name: Recheck draft and monotonic release order
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const stableTag = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
            const requested = process.env.RELEASE_TAG.match(stableTag).slice(1).map(BigInt);
            const compare = (left, right) => {
              for (let index = 0; index < 3; index += 1) {
                if (left[index] > right[index]) return 1;
                if (left[index] < right[index]) return -1;
              }
              return 0;
            };
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const requestedRelease = releases.find(
              (release) => release.tag_name === process.env.RELEASE_TAG,
            );
            if (!requestedRelease?.draft || requestedRelease.prerelease) {
              throw new Error(
                `Expected ${process.env.RELEASE_TAG} to remain an unpublished, non-prerelease draft.`,
              );
            }
            for (const release of releases) {
              if (release.draft || release.prerelease) continue;
              const match = release.tag_name.match(stableTag);
              if (match && compare(requested, match.slice(1).map(BigInt)) <= 0) {
                throw new Error(
                  `${process.env.RELEASE_TAG} would roll stable aliases back from ${release.tag_name}.`,
                );
              }
            }
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: ${{ env.ORAS_VERSION }}
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ github.token }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Refuse a registry version rollback
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The single-quoted argument contains JavaScript template literals.
          # shellcheck disable=SC2016
          oras repo tags "$IMAGE_NAME" --format json \
            | REQUESTED_VERSION="$RELEASE_VERSION" node --input-type=module --eval '
                let source = "";
                for await (const chunk of process.stdin) source += chunk;
                const payload = JSON.parse(source);
                if (!Array.isArray(payload.tags)) throw new Error("GHCR returned an invalid tag list.");

                const stable = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
                const parts = (version) => version.match(stable)?.slice(1).map(BigInt);
                const requested = parts(process.env.REQUESTED_VERSION);
                if (!requested) throw new Error("Requested version is not stable SemVer.");
                const compare = (left, right) => {
                  for (let index = 0; index < 3; index += 1) {
                    if (left[index] > right[index]) return 1;
                    if (left[index] < right[index]) return -1;
                  }
                  return 0;
                };

                for (const tag of payload.tags) {
                  const existing = parts(tag);
                  if (existing && compare(requested, existing) <= 0) {
                    console.error(
                      `::error::${process.env.REQUESTED_VERSION} would roll registry aliases back from ${tag}.`,
                    );
                    process.exit(1);
                  }
                }
              '
      - name: Promote exact verified digest
        env:
          IMAGE_DIGEST: ${{ needs.publish-candidate.outputs.digest }}
          MAJOR_VERSION: ${{ needs.validate-release-metadata.outputs.major }}
          MINOR_VERSION: ${{ needs.validate-release-metadata.outputs.minor }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          set +e
          resolve_output=$(oras resolve "${IMAGE_NAME}:${RELEASE_VERSION}" 2>&1)
          resolve_status=$?
          set -e
          if (( resolve_status == 0 )); then
            echo "::error::Refusing to overwrite immutable ${IMAGE_NAME}:${RELEASE_VERSION}."
            exit 1
          fi
          if ! grep --extended-regexp --ignore-case --quiet \
            'not found|manifest unknown|manifest_unknown|name unknown|name_unknown' <<<"$resolve_output"; then
            echo "::error::The registry did not prove that the version tag is absent."
            exit 1
          fi

          minor_tag="${MAJOR_VERSION}.${MINOR_VERSION}"
          oras cp "${IMAGE_NAME}@${IMAGE_DIGEST}" \
            "${IMAGE_NAME}:${RELEASE_VERSION},${minor_tag},${MAJOR_VERSION},latest"

          for tag in "$RELEASE_VERSION" "$minor_tag" "$MAJOR_VERSION" latest; do
            if [[ "$(oras resolve "${IMAGE_NAME}:${tag}")" != "$IMAGE_DIGEST" ]]; then
              echo "::error::Stable tag ${tag} does not resolve to the verified candidate digest."
              exit 1
            fi
          done
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io || true

  verify-stable:
    name: Verify public stable tags
    if: ${{ always() && needs.validate-release-metadata.result == 'success' && needs.publish-candidate.result == 'success' && needs.promote-stable.result == 'success' }}
    needs:
      - validate-release-metadata
      - publish-candidate
      - promote-stable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: ${{ env.ORAS_VERSION }}
      - name: Pull stable image anonymously
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
          IMAGE_DIGEST: ${{ needs.publish-candidate.outputs.digest }}
          MAJOR_VERSION: ${{ needs.validate-release-metadata.outputs.major }}
          MINOR_VERSION: ${{ needs.validate-release-metadata.outputs.minor }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir --parents "$DOCKER_CONFIG"
          minor_tag="${MAJOR_VERSION}.${MINOR_VERSION}"
          for tag in "$RELEASE_VERSION" "$minor_tag" "$MAJOR_VERSION" latest; do
            test "$(oras resolve "${IMAGE_NAME}:${tag}")" = "$IMAGE_DIGEST"
          done
          docker pull "${IMAGE_NAME}:${RELEASE_VERSION}"
          docker image inspect "${IMAGE_NAME}:${RELEASE_VERSION}" --format '{{json .RepoDigests}}' \
            | grep --fixed-strings "$IMAGE_DIGEST"

  finalize:
    name: Publish verified GitHub release
    if: ${{ always() && needs.publish-candidate.result == 'success' && needs.release-coverage.result == 'success' && needs.verify-stable.result == 'success' }}
    needs:
      - publish-candidate
      - release-coverage
      - verify-stable
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Generate release install assets
        env:
          IMAGE_DIGEST: ${{ needs.publish-candidate.outputs.digest }}
        run: >-
          node scripts/release/install-bundle.mjs
          --version "${{ inputs.version }}"
          --digest "$IMAGE_DIGEST"
          --source-sha "${{ inputs.release_sha }}"
          --output "${{ runner.temp }}/release-install-assets"
      - name: Sign and verify the release asset manifest
        env:
          ASSET_DIRECTORY: ${{ runner.temp }}/release-install-assets
        run: |
          set -euo pipefail
          manifest="$ASSET_DIRECTORY/release-manifest.json"
          bundle="$ASSET_DIRECTORY/release-manifest.sigstore.json"
          cosign sign-blob --yes --bundle "$bundle" "$manifest"
          cosign verify-blob "$manifest" \
            --bundle "$bundle" \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
      - name: Attach install assets to the draft
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ASSET_DIRECTORY: ${{ runner.temp }}/release-install-assets
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const release = releases.find(
              (candidate) => candidate.tag_name === process.env.RELEASE_TAG,
            );
            if (!release?.draft) {
              throw new Error(`Expected an unpublished release draft for ${process.env.RELEASE_TAG}.`);
            }
            const names = [
              "compose.yaml",
              "omnifin.env.example",
              "SHA256SUMS",
              "release-manifest.json",
              "release-manifest.sigstore.json",
            ];
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              per_page: 100,
            });
            for (const name of names) {
              if (existing.some((asset) => asset.name === name)) {
                throw new Error(`Refusing to overwrite release asset ${name}.`);
              }
            }
            for (const name of names) {
              const data = fs.readFileSync(path.join(process.env.ASSET_DIRECTORY, name));
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name,
                data,
                headers: {
                  "content-length": data.length,
                  "content-type": "application/octet-stream",
                },
              });
            }
      - name: Publish draft after stable digest verification
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          IMAGE_DIGEST: ${{ needs.publish-candidate.outputs.digest }}
          RELEASE_PROFILE: ${{ needs.release-coverage.outputs.profile }}
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const release = releases.find(
              (candidate) => candidate.tag_name === process.env.RELEASE_TAG,
            );
            if (!release?.draft) {
              throw new Error(`Expected an unpublished release draft for ${process.env.RELEASE_TAG}.`);
            }

            const digestLine = `Container digest: \`${process.env.IMAGE_DIGEST}\``;
            const profileLine = `Release coverage profile: \`${process.env.RELEASE_PROFILE}\``;
            const installLine =
              "Install bundle: verify `release-manifest.json` with `release-manifest.sigstore.json`, then verify its listed SHA-256 digests before starting `compose.yaml`.";
            const evidenceLines = [digestLine, profileLine, installLine].filter(
              (line) => !release.body?.includes(line),
            );
            const body = `${release.body || ""}\n\n${evidenceLines.join("\n")}`.trim();
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body,
              draft: false,
              make_latest: "true",
            });
