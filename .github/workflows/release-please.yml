name: Release Please

on:
  workflow_run:
    workflows:
      - Security
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  prerequisite:
    name: Release automation readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.status.outputs.enabled }}
      eligible: ${{ steps.status.outputs.eligible }}
    steps:
      - name: Validate source and report automation status
        id: status
        env:
          AUTOMATION_ENABLED: ${{ vars.OMNIFIN_RELEASE_AUTOMATION_ENABLED }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_CONCLUSION" != "success" ] || [ "$SOURCE_EVENT" != "push" ] || \
             [ "$SOURCE_BRANCH" != "main" ] || [ "$SOURCE_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No release mutation: this is not a successful protected-main Security push run."
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          if [ "$AUTOMATION_ENABLED" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release automation is pending protected token configuration; no release secret was consumed."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Release automation is enabled; exact-SHA main gates will be verified before any release mutation."

  verify-main-gates:
    name: Verify exact main gates
    if: needs.prerequisite.outputs.eligible == 'true' && needs.prerequisite.outputs.enabled == 'true'
    needs: prerequisite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Require CI and Security for the exact current main SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/verify-main-gates.mjs
          --sha "${{ github.event.workflow_run.head_sha }}"
          --require-main-tip --wait-seconds 900

  release:
    name: Prepare or create release
    needs: verify-main-gates
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      release-sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Require dedicated release automation token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is required so release pull requests trigger normal checks."
            exit 1
          fi
      - name: Maintain the reviewed release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    name: Publish release image
    if: needs.release.outputs.release-created == 'true'
    needs: release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release.outputs.tag-name }}
      version: ${{ needs.release.outputs.version }}
      release_sha: ${{ needs.release.outputs.release-sha }}
