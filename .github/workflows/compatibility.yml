name: Compatibility canary

on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-canary-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  NODE_VERSION: "24"
  ORAS_VERSION: "1.3.3"
  PNPM_VERSION: "11.9.0"

jobs:
  resolve:
    name: Resolve latest stable upstream images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out immutable canary policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: ${{ env.ORAS_VERSION }}
      - name: Resolve newest allowlisted stable tags before image acquisition
        run: >-
          node scripts/integration/compatibility-targets.mjs resolve
          --output artifacts/compatibility/targets.json
      - name: Upload immutable target ledger
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-targets-${{ github.run_id }}
          path: artifacts/compatibility/targets.json
          if-no-files-found: error
          retention-days: 30

  media:
    name: Generate compatibility media fixture
    needs:
      - resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out copyright-free fixture generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: scripts/ci/install-dependencies.sh
      - name: Pull immutable media runtime
        run: >-
          docker pull
          ghcr.io/jellyfin/jellyfin:10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
      - name: Generate copyright-free playback media
        run: pnpm fixture:media --output artifacts/media/playback-fixture
      - name: Upload generated playback fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-media-${{ github.run_id }}
          path: artifacts/media/playback-fixture
          if-no-files-found: error
          retention-days: 1

  canary:
    name: Latest stable compatibility (${{ matrix.service }})
    needs:
      - resolve
      - media
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - service: authentik
            browser: true
          - service: bazarr
            browser: false
          - service: jellyfin
            browser: false
          - service: oidc
            browser: true
          - service: prowlarr
            browser: false
          - service: qbittorrent
            browser: false
          - service: radarr
            browser: false
          - service: sabnzbd
            browser: false
          - service: seerr
            browser: false
          - service: sonarr
            browser: false
    steps:
      - name: Check out production connector harnesses
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: scripts/ci/install-dependencies.sh
      - name: Install isolated browser runtime
        if: matrix.browser
        run: node scripts/ci/install-playwright.mjs chromium
      - name: Build identity control plane
        if: matrix.browser
        run: pnpm build
      - name: Build production connectors
        if: matrix.browser == false
        run: pnpm --filter @omnifin/connectors... build
      - name: Download immutable target ledger
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compatibility-targets-${{ github.run_id }}
          path: artifacts/compatibility
      - name: Download playback fixture
        if: matrix.service == 'jellyfin'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compatibility-media-${{ github.run_id }}
          path: artifacts/media/playback-fixture
      - name: Exercise fresh isolated upstream service
        env:
          COMPATIBILITY_SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          fixture_arguments=()
          if [ "$COMPATIBILITY_SERVICE" = "jellyfin" ]; then
            fixture_arguments=(
              --fixture artifacts/media/playback-fixture/omnifin-playback-fixture.mp4
            )
          fi
          node scripts/integration/compatibility-service.mjs run \
            --service "$COMPATIBILITY_SERVICE" \
            --targets artifacts/compatibility/targets.json \
            --output "artifacts/compatibility/services/${COMPATIBILITY_SERVICE}.json" \
            "${fixture_arguments[@]}"
      - name: Upload sanitized service evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-service-${{ matrix.service }}-${{ github.run_id }}
          path: artifacts/compatibility/services/${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Validate sanitized compatibility evidence
    if: always() && needs.resolve.result == 'success'
    needs:
      - resolve
      - canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.report.outputs.status }}
    steps:
      - name: Check out closed report policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download immutable target ledger
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compatibility-targets-${{ github.run_id }}
          path: artifacts/compatibility
      - name: Download sanitized service reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: compatibility-service-*-${{ github.run_id }}
          path: artifacts/compatibility/services
          merge-multiple: true
      - name: Build schema-validated aggregate report
        id: report
        env:
          VERIFIED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/integration/compatibility-report.mjs aggregate \
            --targets artifacts/compatibility/targets.json \
            --reports artifacts/compatibility/services \
            --commit "$VERIFIED_COMMIT" \
            --output artifacts/compatibility/compatibility.json
          report_status=$(jq --raw-output '.status' artifacts/compatibility/compatibility.json)
          if [ "$report_status" != "passed" ] && [ "$report_status" != "failed" ]; then
            echo "::error::The aggregate report returned an invalid status."
            exit 1
          fi
          echo "status=$report_status" >> "$GITHUB_OUTPUT"
      - name: Upload sanitized compatibility report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-canary-${{ github.run_id }}
          path: artifacts/compatibility/compatibility.json
          if-no-files-found: error
          retention-days: 30

  issues:
    name: Maintain compatibility regression issue
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.aggregate.result == 'success'
    needs:
      - aggregate
      - canary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download sanitized aggregate report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compatibility-canary-${{ github.run_id }}
          path: artifacts/compatibility
      - name: Open, update, or resolve compatibility issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_PATH: artifacts/compatibility/compatibility.json
        with:
          script: |
            const fs = require("node:fs");
            const title = "Compatibility canary regression";
            const label = "compatibility";
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (report?.schemaVersion !== 1 || !["failed", "passed"].includes(report.status)) {
              core.setFailed("The sanitized compatibility report is invalid.");
              return;
            }

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: "1D76DB",
                description: "Upstream service compatibility and version regressions",
              });
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              labels: label,
              per_page: 100,
            });
            const matching = issues.find((issue) => issue.title === title && !issue.pull_request);

            if (report.status === "failed") {
              const failures = report.services
                .filter((service) => service.status === "failed")
                .map((service) => `- ${service.service} ${service.upstreamVersion}: \`${service.errorCategory}\``);
              const body = [
                "The weekly disposable latest-stable compatibility canary detected a regression.",
                "",
                `- Commit: \`${report.commit}\``,
                `- Workflow run: ${runUrl}`,
                ...failures,
                "",
                "Download the schema-validated sanitized artifact from the workflow run for exact image digests and checks.",
              ].join("\n");
              if (matching?.state === "open") {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: matching.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: [label],
                });
              }
            } else if (matching?.state === "open") {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: matching.number,
                body: `The disposable compatibility canary is green again. Verified by ${runUrl}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: matching.number,
                state: "closed",
                state_reason: "completed",
              });
            }

  gate:
    name: Compatibility canary
    if: always()
    needs:
      - resolve
      - media
      - canary
      - aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce complete latest-stable matrix
        env:
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
          CANARY_RESULT: ${{ needs.canary.result }}
          MEDIA_RESULT: ${{ needs.media.result }}
          REPORT_STATUS: ${{ needs.aggregate.outputs.status }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
        run: |
          set -euo pipefail
          test "$RESOLVE_RESULT" = "success"
          test "$MEDIA_RESULT" = "success"
          test "$CANARY_RESULT" = "success"
          test "$AGGREGATE_RESULT" = "success"
          test "$REPORT_STATUS" = "passed"
