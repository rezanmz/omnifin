name: Upgrade rehearsal canary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - .github/workflows/upgrade-rehearsal.yml
      - scripts/release/upgrade-rehearsal.mjs
      - scripts/ci/release-upgrade-rehearsal.test.mjs

permissions:
  contents: read

concurrency:
  group: upgrade-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/rezanmz/omnifin
  ORAS_VERSION: 1.3.3

jobs:
  rehearsal:
    name: Stable-to-edge upgrade rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out immutable rehearsal harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: ${{ env.ORAS_VERSION }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Exercise stable-to-edge upgrade and rollback
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
        run: |
          set -euo pipefail
          mkdir --parents "$DOCKER_CONFIG" artifacts/release
          previous_digest=$(oras resolve "${IMAGE_NAME}:latest")
          candidate_digest=$(oras resolve "${IMAGE_NAME}:edge")
          if [[ ! "$previous_digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || [[ ! "$candidate_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::A public alias returned an invalid digest."
            exit 1
          fi
          if [ "$previous_digest" = "$candidate_digest" ]; then
            echo "::error::No distinct protected-main edge candidate is available to rehearse."
            exit 1
          fi

          previous_ref="${IMAGE_NAME}@${previous_digest}"
          candidate_ref="${IMAGE_NAME}@${candidate_digest}"
          cosign verify \
            --certificate-identity-regexp \
              "^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/(publish|release-please)\\.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$previous_ref" >/dev/null
          cosign verify \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/edge.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$candidate_ref" >/dev/null
          docker pull "$previous_ref"
          docker pull "$candidate_ref"
          node scripts/release/upgrade-rehearsal.mjs \
            --candidate-image "$candidate_ref" \
            --previous-image "$previous_ref" \
            --output artifacts/release/upgrade-rehearsal.json
      - name: Upload sanitized upgrade rehearsal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-to-edge-upgrade-rehearsal-${{ github.run_id }}
          path: artifacts/release/upgrade-rehearsal.json
          if-no-files-found: error
          retention-days: 30
