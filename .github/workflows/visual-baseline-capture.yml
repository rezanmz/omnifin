name: Visual baseline capture

on:
  push:
    branches:
      - feature/download-queue-removal

permissions:
  contents: read

jobs:
  capture:
    name: Capture macOS baselines
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web application
        run: pnpm build
      - name: Install browser runtimes
        run: pnpm --filter @omnifin/web exec playwright install chromium webkit
      - name: Capture removal confirmation baselines
        env:
          CI: "true"
        run: >-
          pnpm --filter @omnifin/web exec playwright test tests/visual/routes.spec.ts
          --grep "download queue removal confirmation visual baseline"
          --project=chromium --project=mobile --update-snapshots
      - name: Upload captured baselines
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: download-removal-darwin-baselines
          path: apps/web/tests/visual/routes.spec.ts-snapshots/download-queue-removal-confirmation-*-darwin.png
          if-no-files-found: error
          retention-days: 1
