name: Pull request publish

on:
  push:
    branches:
      - feature/download-queue-removal

permissions: {}

jobs:
  open:
    name: Open draft pull request
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      HEAD_BRANCH: ${{ github.ref_name }}
      PR_BODY: |
        ## Summary

        - add exact-item qBittorrent and SABnzbd queue removal while preserving downloaded files
        - add durable idempotency, auditing, bounded recovery, retention, and strict public contracts
        - add a typed Liquid Glass confirmation flow with focus restoration and accessible status updates
        - document the API, threat boundaries, compatibility state, and operator behavior

        ## Verification

        - `pnpm verify`
        - `pnpm migration:smoke`
        - Storybook static production build
        - focused connector, gateway, route, and interface tests

        Browser-driven Storybook, accessibility, visual-regression, and Lighthouse gates run on
        the protected Linux CI environment.
    steps:
      - name: Create the draft when absent
        shell: bash
        run: |
          existing="$(gh pr list --head "$HEAD_BRANCH" --state all --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$HEAD_BRANCH" \
            --title "feat: add safe download queue removal" \
            --body "$PR_BODY" \
            --draft
