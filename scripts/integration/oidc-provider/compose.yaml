name: omnifin-oidc-provider-fixture

services:
  provider:
    image: ${OMNIFIN_OIDC_PROVIDER_IMAGE:?immutable OIDC provider image required}
    command:
      - /usr/local/bin/dex
      - serve
      - /etc/dex/config.yaml
    ports:
      - "127.0.0.1:${OMNIFIN_OIDC_PROVIDER_HTTP_PORT:?provider port required}:5556"
    read_only: true
    restart: "no"
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
      - /var/dex:uid=1001,gid=1001,mode=0700
    volumes:
      - ${OMNIFIN_OIDC_PROVIDER_CONFIG:?provider config required}:/etc/dex/config.yaml:ro
    networks:
      - fixture

networks:
  fixture:
    internal: true
